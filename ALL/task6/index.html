<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تغيير الأرقام</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-card" aria-live="polite">
      <div class="numbers" aria-label="الأرقام الحالية">
        <img id="firstNumber" src="imaged/one.svg" alt="الرقم 1" />
        <img id="secondNumber" src="imaged/two.svg" alt="الرقم 2" />
      </div>
      <p class="total">Total = <span id="totalValue">3</span></p>
      <button id="changeButton" type="button">Change</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
