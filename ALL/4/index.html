<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savvy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <span class="logo-shape"></span>
            savvy
        </div>

        <nav>
            <a href="#">FOR CLIENTS</a>
            <a href="#">FOR BUSINESSES</a>
        </nav>

        <a href="#" class="app-store">
            <span class="apple"></span>

            <div>
                <small>Soon on the</small>
                <strong>App Store</strong>
            </div>
        </a>

    </header>


    <main>

        <section class="hero">

            <div class="hero-content">

                <h1>
                    Save<br>
                    your<br>
                    money
                </h1>

                <div class="signup">

                    <p>
                        Get early access
                    </p>

                    <div class="form">

                        <input
                            type="email"
                            placeholder="youremail@mail.com"
                        >

                        <button>
                            sign up
                        </button>

                    </div>

                </div>

            </div>


            <div class="hero-image">

                <img
                    src="transparent.png"
                    alt="Savvy App"
                >

            </div>

        </section>

    </main>


    <footer>

        <div>
            FC
        </div>

        <div>
            IN
        </div>

        <div>
            TW
        </div>

    </footer>

</body>
</html>
